services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-organeasy}
      POSTGRES_USER: ${POSTGRES_USER:-organeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organeasy-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - organeasy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-organeasy} -d ${POSTGRES_DB:-organeasy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - organeasy

  redis:
    image: redis:7-bookworm
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - organeasy_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - organeasy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-organeasy}
      POSTGRES_USER: ${POSTGRES_USER:-organeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organeasy-dev-only}
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - organeasy

volumes:
  organeasy_pgdata:
  organeasy_redisdata:

networks:
  organeasy:
    driver: bridge
